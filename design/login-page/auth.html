<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | Nozomi's Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, 
        #faf8f5 0%, 
        #faf8f5 50%,
        #fdf6e8 65%,
        #f8e8d4 75%,
        #e8d4c0 85%,
        #d4c4a8 95%,
        #c8b898 100%
      );
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: radial-gradient(
        ellipse 120% 80% at 50% 100%,
        rgba(168, 213, 186, 0.6) 0%,
        rgba(212, 232, 220, 0.4) 30%,
        rgba(253, 246, 232, 0.2) 60%,
        transparent 80%
      );
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35%;
      background: radial-gradient(
        ellipse 100% 60% at 50% 100%,
        rgba(45, 90, 39, 0.15) 0%,
        rgba(74, 140, 63, 0.1) 40%,
        transparent 70%
      );
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .headline {
      font-family: 'Noto Serif JP', serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.4;
      color: #1a1a1a;
      margin-bottom: 60px;
      letter-spacing: 0.02em;
    }

    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.9);
      color: #1a1a1a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .auth-btn:active {
      transform: translateY(0);
    }

    .auth-btn .icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-btn .icon svg {
      width: 20px;
      height: 20px;
    }

    .note {
      font-size: 13px;
      color: #888;
    }

    @media (max-width: 480px) {
      .headline {
        font-size: 32px;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      animation: fadeInUp 0.6s ease forwards;
    }

    .headline {
      animation: fadeInUp 0.6s ease 0.1s forwards;
      opacity: 0;
    }

    .auth-btn {
      animation: fadeInUp 0.6s ease 0.2s forwards;
      opacity: 0;
    }

    .note {
      animation: fadeInUp 0.6s ease 0.3s forwards;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍳</div>

    <h1 class="headline">
      レシピを保存しよう。
    </h1>

    <div class="auth-buttons">
      <button class="auth-btn google">
        <span class="icon">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </span>
        Googleで続ける
      </button>
    </div>

    <p class="note">初めての方は自動でアカウントが作成されます</p>
  </div>

  <script>
    document.querySelector('.auth-btn.google').addEventListener('click', () => {
      alert('Google認証を開始します');
    });
  </script>
</body>
</html>
