<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヘッダー | Nozomi's Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #faf8f5;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #2d5a27;
    }

    .logo-icon {
      font-size: 24px;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
    }

    .auth-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .login-link {
      font-size: 13px;
      color: #2d5a27;
      text-decoration: none;
      font-weight: 500;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    .signup-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: linear-gradient(135deg, #2d5a27, #3d7a37);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .signup-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45, 90, 39, 0.3);
    }

    .signup-btn .icon {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">
      <span class="logo-icon">🍳</span>
      <span class="logo-text">Nozomi's Recipes</span>
    </a>
    <div class="auth-area">
      <a href="/login" class="login-link">ログイン</a>
      <button class="signup-btn">
        <span class="icon">♡</span>
        レシピを保存
      </button>
    </div>
  </header>
</body>
</html>
